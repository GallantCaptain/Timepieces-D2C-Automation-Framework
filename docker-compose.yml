services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: timepieces-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: timepieces_metrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  # Serves the Allure report as a live web UI. It watches target/allure-results
  # (written by the Maven/Surefire run) and regenerates the report on change, so
  # after any `mvn test` the report — including the MP4 videos attached on
  # failure — is browsable at http://localhost:5252 with no separate generate
  # step. History is kept across runs so trend charts populate.
  allure:
    image: frankescobar/allure-docker-service
    container_name: timepieces-allure
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 1
    ports:
      - "5252:5050"
    volumes:
      - ./target/allure-results:/app/allure-results
      - allure-reports:/app/default-reports

  # --- Healenium self-healing locator backend -------------------------------------
  # Two services below are the minimum Healenium stack: hlm-backend (the REST
  # service SelfHealingDriver talks to — see healenium.properties' hlm.server.url)
  # and its own dedicated Postgres database (kept separate from postgres-dev above,
  # which stores unrelated test-run metrics, not locator-healing data).
  #
  # BOTH SIT BEHIND THE "healenium" PROFILE, and that is load-bearing rather than
  # tidiness. They previously had no profile, which in Compose means "start with
  # everything" — so `docker compose --profile grid up -d` tried to pull them too.
  # `healenium/hlm-backend:latest` no longer resolves upstream ("not found"), and a
  # failed pull aborts the WHOLE command, so the documented Grid command died before
  # a single Grid container started. The operator saw a pull error about a
  # self-healing library they had never enabled, no hub, and then 15/15 tests failing
  # with SessionNotCreatedException — a chain that reads like "cross-browser is
  # broken" when nothing about cross-browser was wrong. Found 2026-07-23.
  #
  # Healenium is opt-in twice over, and both opt-ins are required:
  #     docker compose --profile healenium up -d      (start the backend)
  #     ./mvnw test -Dhealenium.enabled=true          (make DriverFactory use it)
  healenium-postgres:
    image: postgres:13
    profiles: ["healenium"]
    container_name: timepieces-healenium-postgres
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: healenium_user
      POSTGRES_PASSWORD: healenium_pass
    volumes:
      - healenium-pgdata:/var/lib/postgresql/data

  hlm-backend:
    # NOTE: the ":latest" tag does not currently resolve on Docker Hub. Healenium is
    # disabled by default (DEC-0010), so this is inert until someone opts in — but
    # whoever does will need to pin a tag that exists before this service will start.
    image: healenium/hlm-backend:latest
    profiles: ["healenium"]
    container_name: timepieces-healenium-backend
    depends_on:
      - healenium-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://healenium-postgres:5432/healenium
      SPRING_DATASOURCE_USERNAME: healenium_user
      SPRING_DATASOURCE_PASSWORD: healenium_pass
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE-PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      # Must match hlm.server.url in src/test/resources/healenium.properties.
      - "7878:7878"

  # --- OWASP ZAP (DAST) -----------------------------------------------------------
  # ZAP runs as a long-lived DAEMON (no UI) exposing its REST API on 8080. The
  # security suite (OwaspTop10ZapScanTest) talks to that API over HTTP via
  # Rest-Assured — see ZapScanEngine — so no ZAP Java client dependency is needed.
  #
  # This service sits behind the "security" COMPOSE PROFILE, which means it does NOT
  # start with a plain `docker compose up`. You must opt in:
  #     docker compose --profile security up -d zap
  # That keeps ZAP (a heavyweight JVM) out of everyday test runs.
  #
  # Flags explained (ZAP's defaults are locked down, so a daemon needs all of these):
  #   -daemon                        : headless; no desktop UI
  #   -host 0.0.0.0 -port 8090       : listen on all interfaces so the host/CI can reach it
  #   api.addrs.addr.name=.* + regex : allow API calls from any address (the container is
  #                                    only exposed to localhost via the port mapping below)
  #   api.key                        : shared secret every API call must present. Defaults to
  #                                    a dev value; override with ZAP_API_KEY in the environment.
  #
  # THE PORT MUST BE THE SAME INSIDE AND OUT ("8090:8090"), and this is not cosmetic.
  # ZAP's single port serves BOTH its REST API and its HTTP proxy, and it tells the two
  # apart by checking whether the request's Host header matches its own listening
  # address:port. With a rewriting map like "8090:8080" the client sends
  # "Host: localhost:8090" while ZAP listens on 8080, so ZAP does not recognise itself as
  # the target, treats the API call as traffic to PROXY, and tries to forward it to
  # localhost:8090 *inside the container* — where nothing is listening. The symptom is a
  # baffling HTTP 502 "Connection refused" that is emitted by ZAP itself.
  zap:
    image: zaproxy/zap-stable
    container_name: timepieces-zap
    profiles: ["security"]
    # ZAP needs a writable home; the image ships one at /zap/wrk for scan artefacts.
    volumes:
      - ./target/zap:/zap/wrk:rw
    ports:
      # Identical host:container port — see the note above before changing this.
      - "8090:8090"
    command: >
      zap.sh -daemon
      -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY:-timepieces-zap-dev-key}
      -config database.recoverylog=false
    # ZAP takes ~20-40s to boot. The suite waits for this healthcheck rather than
    # sleeping a fixed amount: /JSON/core/view/version/ only answers once the API is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-timepieces-zap-dev-key}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Selenium Grid (opt-in, profile: grid) ---------------------------------------
  # A real self-hosted Grid, so cross-browser runs need no browsers installed on the host
  # and can be scaled by adding nodes (or `--scale`) rather than by buying cloud minutes.
  #
  # Behind the "grid" COMPOSE PROFILE, so it does NOT start with a plain `docker compose
  # up` — same convention as the zap service. Start it explicitly:
  #     docker compose --profile grid up -d
  # then point the suite at it:
  #     ./mvnw test -Dexecution.mode=GRID -Dbrowser=firefox -Denv=production
  #
  # Watch a session live at http://localhost:4444/ui  (VNC password: secret)
  #
  # NOTE ON SCALING: each node advertises how many sessions it will accept
  # (SE_NODE_MAX_SESSIONS). Raising that beyond the container's CPU/RAM makes tests
  # slower and flakier, not faster — a starved browser looks exactly like a flaky app.
  # Scale by adding node REPLICAS, e.g.
  #     docker compose --profile grid up -d --scale selenium-node-chrome=3
  selenium-hub:
    image: selenium/hub:4.44
    container_name: timepieces-selenium-hub
    profiles: ["grid"]
    ports:
      # 4442/4443 are the node<->hub event bus; 4444 is the WebDriver endpoint + the UI.
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      # The suite waits for this rather than sleeping: /wd/hub/status only reports ready
      # once the hub is up AND at least one node has registered.
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/wd/hub/status | grep -q '\"ready\": true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  selenium-node-chrome:
    image: selenium/node-chrome:4.44
    profiles: ["grid"]
    depends_on: [selenium-hub]
    # /dev/shm is 64MB by default in Docker, which Chrome exhausts and then crashes with
    # tab-death that reads like a random test failure. 2gb is the documented remedy.
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080

  selenium-node-firefox:
    image: selenium/node-firefox:4.44
    profiles: ["grid"]
    depends_on: [selenium-hub]
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080

  selenium-node-edge:
    image: selenium/node-edge:4.44
    profiles: ["grid"]
    depends_on: [selenium-hub]
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080

volumes:
  pgdata-dev:
  allure-reports:
  healenium-pgdata:
