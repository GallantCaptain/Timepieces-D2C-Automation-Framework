version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: timepieces-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: timepieces_metrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
