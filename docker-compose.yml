services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: timepieces-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: timepieces_metrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  # Serves the Allure report as a live web UI. It watches target/allure-results
  # (written by the Maven/Surefire run) and regenerates the report on change, so
  # after any `mvn test` the report — including the MP4 videos attached on
  # failure — is browsable at http://localhost:5252 with no separate generate
  # step. History is kept across runs so trend charts populate.
  allure:
    image: frankescobar/allure-docker-service
    container_name: timepieces-allure
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 1
    ports:
      - "5252:5050"
    volumes:
      - ./target/allure-results:/app/allure-results
      - allure-reports:/app/default-reports

  # --- Healenium self-healing locator backend -------------------------------------
  # Two services below are the minimum Healenium stack: hlm-backend (the REST
  # service SelfHealingDriver talks to — see healenium.properties' hlm.server.url)
  # and its own dedicated Postgres database (kept separate from postgres-dev above,
  # which stores unrelated test-run metrics, not locator-healing data). Neither
  # container starts unless you explicitly bring this compose file up AND set
  # healenium.enabled=true in the framework config — see DriverFactory.java.
  healenium-postgres:
    image: postgres:13
    container_name: timepieces-healenium-postgres
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: healenium_user
      POSTGRES_PASSWORD: healenium_pass
    volumes:
      - healenium-pgdata:/var/lib/postgresql/data

  hlm-backend:
    image: healenium/hlm-backend:latest
    container_name: timepieces-healenium-backend
    depends_on:
      - healenium-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://healenium-postgres:5432/healenium
      SPRING_DATASOURCE_USERNAME: healenium_user
      SPRING_DATASOURCE_PASSWORD: healenium_pass
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE-PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      # Must match hlm.server.url in src/test/resources/healenium.properties.
      - "7878:7878"

  # --- OWASP ZAP (DAST) -----------------------------------------------------------
  # ZAP runs as a long-lived DAEMON (no UI) exposing its REST API on 8080. The
  # security suite (OwaspTop10ZapScanTest) talks to that API over HTTP via
  # Rest-Assured — see ZapScanEngine — so no ZAP Java client dependency is needed.
  #
  # This service sits behind the "security" COMPOSE PROFILE, which means it does NOT
  # start with a plain `docker compose up`. You must opt in:
  #     docker compose --profile security up -d zap
  # That keeps ZAP (a heavyweight JVM) out of everyday test runs.
  #
  # Flags explained (ZAP's defaults are locked down, so a daemon needs all of these):
  #   -daemon                        : headless; no desktop UI
  #   -host 0.0.0.0 -port 8090       : listen on all interfaces so the host/CI can reach it
  #   api.addrs.addr.name=.* + regex : allow API calls from any address (the container is
  #                                    only exposed to localhost via the port mapping below)
  #   api.key                        : shared secret every API call must present. Defaults to
  #                                    a dev value; override with ZAP_API_KEY in the environment.
  #
  # THE PORT MUST BE THE SAME INSIDE AND OUT ("8090:8090"), and this is not cosmetic.
  # ZAP's single port serves BOTH its REST API and its HTTP proxy, and it tells the two
  # apart by checking whether the request's Host header matches its own listening
  # address:port. With a rewriting map like "8090:8080" the client sends
  # "Host: localhost:8090" while ZAP listens on 8080, so ZAP does not recognise itself as
  # the target, treats the API call as traffic to PROXY, and tries to forward it to
  # localhost:8090 *inside the container* — where nothing is listening. The symptom is a
  # baffling HTTP 502 "Connection refused" that is emitted by ZAP itself.
  zap:
    image: zaproxy/zap-stable
    container_name: timepieces-zap
    profiles: ["security"]
    # ZAP needs a writable home; the image ships one at /zap/wrk for scan artefacts.
    volumes:
      - ./target/zap:/zap/wrk:rw
    ports:
      # Identical host:container port — see the note above before changing this.
      - "8090:8090"
    command: >
      zap.sh -daemon
      -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY:-timepieces-zap-dev-key}
      -config database.recoverylog=false
    # ZAP takes ~20-40s to boot. The suite waits for this healthcheck rather than
    # sleeping a fixed amount: /JSON/core/view/version/ only answers once the API is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-timepieces-zap-dev-key}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata-dev:
  allure-reports:
  healenium-pgdata:
