name: exploratory-search-tests

# Runs the 50 randomized exploratory search API tests on:
#   - a nightly schedule at 6:00 AM IST (00:30 UTC)
#   - manual dispatch (workflow_dispatch)
on:
  # Portfolio copy: manual runs only. Scheduled / PR / dispatch triggers removed so
  # nothing runs automatically against the original application.
  workflow_dispatch:

concurrency:
  group: exploratory-search-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-exploratory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup the Java environment (JDK 25)
      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      # Step 3: Execute the exploratory search API tests (headless HTTP, no browsers needed)
      - name: Execute Exploratory Search API Tests
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CF_BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mvn -B test \
            -Dsurefire.suite=testng-exploratory.xml \
            -Denv=production

      # Step 4: Build the Allure report even when tests fail
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # Step 5: Publish the report as a downloadable artifact
      - name: Upload Allure Report as Artifact
        id: upload_allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-exploratory-${{ github.run_number }}
          path: target/site/allure-maven-plugin/
          retention-days: 30

      # Step 6: Email a summary + link to the uploaded report artifact (no-op
      # unless the SMTP_* repo secrets are set). Link mode avoids corporate
      # .zip-attachment filters.
      - name: Email Allure Report
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_SOURCE: ci
          MAIL_ATTACH: 'false'
          REPORT_URL: ${{ steps.upload_allure.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/email_allure_report.py
