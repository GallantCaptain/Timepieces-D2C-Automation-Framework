name: Test Suite Runner & Metrics Publisher

on:
  # PR runs are owned by staging-tests.yml. Running PRs here too would fire the
  # staging suite twice per PR (two workflows hitting the same login number at once →
  # OTP "too many attempts" cooldown). This pipeline now runs only on explicit
  # dispatch and the dashboard's repository_dispatch (it keeps the Allure publish).
  repository_dispatch:
    types: [run-smoke-tests]
  workflow_dispatch:
    inputs:
      env:
        description: "Target Execution Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      browser:
        description: "Browser Target"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - brave
      tags:
        # Leave EMPTY (the default) to let each runner use its own @CucumberOptions tags
        # (SmokeRunner=@Smoke, RegressionRunner=@Regression and not @Smoke). That keeps a
        # dual-tagged scenario running ONCE. Setting a value here passes
        # -Dcucumber.filter.tags, which OVERRIDES every runner's tags at once — so the same
        # scenario can execute under both runners (double OTP request → rate-limit). Only set
        # it for ad-hoc filtered runs, and prefer a single matching runner.
        description: "Optional Cucumber tag override (empty = use runner defaults; recommended)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Install Browser Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox

      - name: Fetch Allure History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Try fetching gh-pages branch to pull previous allure history
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- allure-history || true
          if [ -d "allure-history" ]; then
            mkdir -p target/allure-results/history
            cp -r allure-history/* target/allure-results/history/ || true
            echo "Successfully loaded previous allure history."
          else
            echo "No previous allure history found."
          fi

      - name: Execute Automation Tests
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          STAGING_GATE_PASS: ${{ secrets.STAGING_PASSWORD }}
          CF_BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Only pass -Dcucumber.filter.tags when a tag override was explicitly supplied.
          # When empty (the default for PRs, repository_dispatch, and unset dispatch inputs),
          # the runners use their own tags and each scenario runs once — no double execution.
          TAG_ARG=""
          if [ -n "${{ inputs.tags }}" ]; then
            TAG_ARG="-Dcucumber.filter.tags=${{ inputs.tags }}"
          fi
          mvn test \
            -Denv="${{ inputs.env || 'staging' }}" \
            -Dbrowser="${{ inputs.browser || 'chrome' }}" \
            -Dheadless=true \
            $TAG_ARG \
            -Dchrome.no.sandbox=true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Organize Reports for Deployment
        if: always()
        run: |
          mkdir -p deploy/runs/${{ github.run_number }}
          cp -r target/site/allure-maven-plugin/* deploy/runs/${{ github.run_number }}/
          cp -r target/site/allure-maven-plugin/* deploy/

          # Maintain history directory for next runs
          mkdir -p allure-history
          cp -r target/site/allure-maven-plugin/history/* allure-history/ || true
          cp -r allure-history deploy/

      # Publish the reports to GitHub Pages so stakeholders get a permanent,
      # click-only link (no login) that matches the dashboard's report URL:
      #   https://<owner>.github.io/<repo>/runs/<run_number>/
      # keep_files preserves prior runs/<n>/ so history accumulates. Requires
      # Pages enabled on the repo with the gh-pages branch as its source.
      - name: Publish Allure Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true

      - name: Upload Allure Report as Artifact
        id: upload_allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/site/allure-maven-plugin/
          retention-days: 30

      # Email a summary + link to the uploaded report artifact (no-op unless the
      # SMTP_* repo secrets are set). Link mode avoids corporate .zip filters.
      - name: Email Allure Report
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_SOURCE: ci
          MAIL_ATTACH: 'false'
          # Public, login-free GitHub Pages report (matches the dashboard link).
          # Pages may take ~1 min to go live after the deploy step.
          REPORT_URL: https://timepiecestech.github.io/qa-automation/runs/${{ github.run_number }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/email_allure_report.py
