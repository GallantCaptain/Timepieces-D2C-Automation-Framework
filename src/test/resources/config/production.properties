# Core Environment
base.url=https://www.timepieces-d2c.example
api.base.url=https://api.timepieces-d2c.example

# Browser & Execution
browser=chrome
# HEADLESS BY DEFAULT (2026-07-23). DriverFactory reads "headless"; "is.headless" is kept
# only for parity with staging.properties and is IGNORED. Both are set true and kept in
# agreement so neither file can silently disagree with the other again (see ISSUE-005).
# Override for a headed run (which is also what video recording needs): -Dheadless=false
headless=true
is.headless=true
# execution.target was REMOVED 2026-07-23 - dead config, read by nothing.
execution.mode=local

# Timeouts (in seconds)
timeout.implicit=10
timeout.explicit=20
timeout.pageLoad=30
explicit.wait.timeout=15

# Login path — PLACEHOLDER, awaiting confirmation from product owner before any prod run
login.path=/login

# Healenium self-healing locators — disabled by default, same reasoning as
# staging.properties. Flip via -Dhealenium.enabled=true only once the hlm-backend
# service (docker-compose.yml) is reachable from wherever this suite runs.
healenium.enabled=false
# Reference value only — see src/test/resources/healenium.properties (hlm.server.url)
# for the value the Healenium client actually uses.
healenium.server.url=http://localhost:7878

# Video recording disabled for first prod smoke; flip to true after stable
# Video is ON for every test. It only actually engages where it can capture something
# real - see ScreenRecorderUtil.canRecordMeaningfully(): the recorder captures the DESKTOP,
# so a headless browser would produce a video of an empty screen. Headed local runs
# (-Dheadless=false) and Docker (Xvfb virtual display) record properly; headless runs skip
# with a loud warning and keep their failure screenshots.
recordVideo=true

# BrowserStack (populate via CI secrets, not committed)
bs.username=${BS_USER}
bs.accessKey=${BS_KEY}

# TestNG Retry Analyzer - Number of retry attempts for failed test scenarios
max.retry.count=1

# --- OWASP ZAP (DAST) security scan -------------------------------------------
# PRODUCTION IS PASSIVE-ONLY BY DELIBERATE DESIGN. Read before changing anything here.
#
# "baseline" = spider the site and run ZAP's PASSIVE rules over the traffic. Passive
# rules only OBSERVE responses that would have been sent anyway; they never inject a
# payload, never submit a form, and never write data. That is what makes it safe to
# point at a live store on a schedule.
#
# The alternative, "full", fires real SQLi/XSS/command-injection payloads at every
# form and endpoint it discovers. Against www.timepieces-d2c.example that could create junk
# orders, bill and send real OTP SMS to real customers' phones via Twilio, throw
# attack traffic at Razorpay (a third party we have no authorisation to scan), and
# degrade the storefront for live shoppers.
#
# OwaspTop10ZapScanTest therefore REFUSES to run an active scan against production
# unless zap.allow.prod.active=true is set explicitly. Do not flip that flag without
# written sign-off from the store owner and an agreed maintenance window.
zap.scan.mode=baseline
zap.allow.prod.active=false

zap.api.url=http://localhost:8090
zap.api.key=timepieces-zap-dev-key
zap.target.url=https://www.timepieces-d2c.example

zap.spider.max.duration.minutes=5
# AJAX spider drives a real browser over the LIVE storefront. Left on: it only issues
# normal navigation requests (the same ones a shopper's browser makes), but keep the
# budget tight so it cannot wander.
zap.ajax.spider.enabled=true
zap.ajax.spider.max.duration.minutes=3
# Unused while zap.scan.mode=baseline; kept so the key exists if an authorised,
# supervised active scan is ever run against prod.
zap.active.scan.max.duration.minutes=15

zap.fail.on.risk=High
zap.exclude.regex=.*/api/request-token.*|.*otp.*|.*razorpay.*|.*payment.*|.*logout.*|.*/checkout.*|.*/cart.*

# Alert filters: re-grade known false positives. Format (semicolon-separated):
#   ruleId|newLevel|urlRegex
# newLevel: -1 = False Positive (hidden), 0 = Informational, 1 = Low, 2 = Medium, 3 = High
# urlRegex may be empty to mean "every URL".
#
# 10062 = "PII Disclosure". VERIFIED FALSE POSITIVE ON THIS STACK, 2026-07-17.
# The rule finds card numbers by matching long digit runs and Luhn-checking them.
# Timepieces runs on Shopify, whose numeric GIDs are Luhn-valid digit strings sitting in
# card-number ranges. The first production baseline raised 18 High "PII Disclosure"
# alerts and every one was a Shopify GID - confirmed by fetching the pages:
#   https://www.timepieces-d2c.example/products/auriqua-noir-rose -> gid://shopify/MediaImage/36474036551724
#   https://www.timepieces-d2c.example/blog                       -> gid://shopify/Article/574019469356
# The rule only ever sees the bare number, never the surrounding gid://shopify/... , so
# it cannot distinguish them on a Shopify storefront.
#
# Demoted to Informational (0), NOT hidden (-1): the findings stay in the report for a
# human to review, they just no longer fail the weekly run. A scan that cries wolf every
# Sunday is a scan that gets switched off.
#
# TRADE-OFF, EYES OPEN: a genuine card number leaked into a response would now also be
# reported as Informational rather than failing the build. If PII leakage becomes a live
# concern, review these entries manually or tighten the filter to a urlRegex.
zap.alert.filters=10062|0|
# Browser the AJAX spider drives. MUST be headless (the ZAP container has no X server)
# and MUST exist in the image: zaproxy/zap-stable ships Firefox ESR but NOT Chrome, so
# "chrome-headless" fails with an opaque {"code":"internal_error"}.
zap.ajax.spider.browser=firefox-headless

# Which OWASP Top 10 edition the report is written against: 2021 or 2025.
# Defaults to 2025 (the current list). ZAP 2.17 tags every alert with BOTH editions, and
# measured tag coverage is identical (237/239 = 99.2% on a real staging scan), so the
# choice costs no classification accuracy. 2021 is kept because audit and compliance
# paperwork still cites it. See docs/security-zap.md.
zap.owasp.edition=2025

# How the suite answers the cookie consent bar: reject (default) | accept | ignore.
# "reject" keeps the run closest to a clean room - no analytics_storage, no ad_storage,
# no marketing tags firing during a test, and no synthetic traffic fed into the site's
# analytics. The bar is a real modal (role=dialog, z-index 9999) pinned to the bottom of
# the viewport, so leaving it up ("ignore") WILL intercept clicks near the bottom of the
# page. Handled globally in BasePage.open() via SiteOverlayHandler.
cookie.consent.mode=reject

# --- Selenium Grid (self-hosted) ----------------------------------------------
# execution.mode selects WHERE the browser runs:
#   local  (default) - a browser installed on this machine
#   GRID             - the self-hosted Grid from docker-compose (profile: grid)
#   CLOUD            - LambdaTest (POC; see DriverFactory - it does NOT honour -Dbrowser)
#
# Start the Grid, then point the suite at it:
#   docker compose --profile grid up -d
#   ./mvnw test -Dexecution.mode=GRID -Dbrowser=firefox -Denv=production
# Watch a live session at http://localhost:4444/ui (VNC password: secret)
grid.hub.url=http://localhost:4444/wd/hub
