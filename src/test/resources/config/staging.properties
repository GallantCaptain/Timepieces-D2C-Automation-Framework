# Core Environment
base.url=https://timepieces-d2c.example
api.base.url=https://api.timepieces-d2c.example

# Browser & Execution
browser=chrome
is.headless=false
execution.target=local # options: local, grid, browserstack
# Safari is macOS-only. On Linux (Docker/CI) and Windows, browser=safari is dynamically
# substituted with this Chromium browser so the suite still runs (chrome | edge | brave).
safari.fallback.browser=chrome

# Timeouts (in seconds)
timeout.implicit=10
timeout.explicit=20
timeout.pageLoad=30

# BrowserStack Credentials (Avoid hardcoding passwords here; use GitHub Secrets later, but set the keys)
bs.username=${BS_USER}
bs.accessKey=${BS_KEY}

# Healenium self-healing locators. Disabled by default so plain local/CI runs are
# unaffected: enabling it wraps the WebDriver in Healenium's SelfHealingDriver (see
# DriverFactory.wrapWithHealenium), which expects the hlm-backend service from
# docker-compose.yml to be reachable at healenium.server.url below. Turn on with
# -Dhealenium.enabled=true once `docker compose up healenium-postgres hlm-backend`
# is running locally.
healenium.enabled=false
# Reference value only — the Healenium client itself reads its own copy of this URL
# from src/test/resources/healenium.properties (hlm.server.url), not from here.
healenium.server.url=http://localhost:7878

#These two keys that LoginPage.open() and BasePage now depend on
explicit.wait.timeout=15
base.url=https://staging.timepieces-d2c.example
login.path=/login

# Monte screen recording of failing scenarios. Recordings are transcoded to MP4
# (H.264) via ffmpeg so they play inline inside the Allure report. NOTE: the
# recorder captures the full desktop, so it is meant for headed, ideally serial
# runs; headless JVMs skip it automatically.
recordVideo=true
# ffmpeg executable used to transcode AVI recordings to inline-playable MP4.
# Leave as 'ffmpeg' to use the one on PATH, or set an absolute path here / via the
# FFMPEG_PATH env var.
ffmpeg.path=ffmpeg

# TestNG Retry Analyzer - Number of retry attempts for failed test scenarios
max.retry.count=2

# OTP timing (observed staging behaviour) — see LoginPage SECURITY NOTE.
# Resend OTP is gated by a ~90s countdown; the "Too many attempts" lockout is a ~90s cooldown.
otp.resend.cooldown.seconds=90
otp.cooldown.seconds=90
# How many wrong OTP codes the @OtpBruteForce security probe submits to show there is no cap.
otp.bruteforce.attempts=20

# Twilio Integration (POC placeholders)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}