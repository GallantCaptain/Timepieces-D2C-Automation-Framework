# Core Environment
base.url=https://timepieces-d2c.example
api.base.url=https://api.timepieces-d2c.example

# Browser & Execution
browser=chrome
is.headless=false
execution.target=local # options: local, grid, browserstack
# Safari is macOS-only. On Linux (Docker/CI) and Windows, browser=safari is dynamically
# substituted with this Chromium browser so the suite still runs (chrome | edge | brave).
safari.fallback.browser=chrome

# Timeouts (in seconds)
timeout.implicit=10
timeout.explicit=20
timeout.pageLoad=30

# BrowserStack Credentials (Avoid hardcoding passwords here; use GitHub Secrets later, but set the keys)
bs.username=${BS_USER}
bs.accessKey=${BS_KEY}

# Healenium self-healing locators. Disabled by default so plain local/CI runs are
# unaffected: enabling it wraps the WebDriver in Healenium's SelfHealingDriver (see
# DriverFactory.wrapWithHealenium), which expects the hlm-backend service from
# docker-compose.yml to be reachable at healenium.server.url below. Turn on with
# -Dhealenium.enabled=true once `docker compose up healenium-postgres hlm-backend`
# is running locally.
healenium.enabled=false
# Reference value only — the Healenium client itself reads its own copy of this URL
# from src/test/resources/healenium.properties (hlm.server.url), not from here.
healenium.server.url=http://localhost:7878

#These two keys that LoginPage.open() and BasePage now depend on
explicit.wait.timeout=15
base.url=https://staging.timepieces-d2c.example
login.path=/login

# Monte screen recording of failing scenarios. Recordings are transcoded to MP4
# (H.264) via ffmpeg so they play inline inside the Allure report. NOTE: the
# recorder captures the full desktop, so it is meant for headed, ideally serial
# runs; headless JVMs skip it automatically.
recordVideo=true
# ffmpeg executable used to transcode AVI recordings to inline-playable MP4.
# Leave as 'ffmpeg' to use the one on PATH, or set an absolute path here / via the
# FFMPEG_PATH env var.
ffmpeg.path=ffmpeg

# TestNG Retry Analyzer - Number of retry attempts for failed test scenarios
max.retry.count=2

# OTP timing (observed staging behaviour) — see LoginPage SECURITY NOTE.
# Resend OTP is gated by a ~90s countdown; the "Too many attempts" lockout is a ~90s cooldown.
otp.resend.cooldown.seconds=90
otp.cooldown.seconds=90
# How many wrong OTP codes the @OtpBruteForce security probe submits to show there is no cap.
otp.bruteforce.attempts=20

# Twilio Integration (POC placeholders)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}
# --- OWASP ZAP (DAST) security scan -------------------------------------------
# Consumed by ZapScanEngine / OwaspTop10ZapScanTest. The ZAP daemon itself comes
# from docker-compose.yml (`docker compose --profile security up -d zap`).
zap.api.url=http://localhost:8090
zap.api.key=timepieces-zap-dev-key
# Target to scan. Defaults to base.url when blank.
zap.target.url=https://staging.timepieces-d2c.example

# Scan depth. "full" = spider + passive rules + ACTIVE attack payloads.
# Staging is a throwaway environment, so full active scanning is appropriate here.
zap.scan.mode=full

# Traditional spider crawl budget (minutes). 0 = unlimited (not advised in CI).
zap.spider.max.duration.minutes=5
# The AJAX spider drives a real browser to reach JS-rendered routes a plain HTTP
# spider cannot see. Slower, but Timepieces is a JS-heavy storefront so it earns its keep.
zap.ajax.spider.enabled=true
zap.ajax.spider.max.duration.minutes=5
# Active-scan budget (minutes). The scan is force-stopped and whatever was found so
# far is reported, so a slow scan degrades to partial coverage instead of hanging CI.
zap.active.scan.max.duration.minutes=25

# Minimum ZAP risk level that FAILS an OWASP category test: High | Medium | Low.
# Lower-risk alerts are still reported/attached, just not failed on.
zap.fail.on.risk=High

# Endpoints NEVER hit with active attack payloads, even on staging. These have real
# side effects: OTP endpoints bill and send real SMS through Twilio, and Razorpay is a
# THIRD-PARTY system we are not authorised to attack. Java regex, pipe-separated.
zap.exclude.regex=.*/api/request-token.*|.*otp.*|.*razorpay.*|.*payment.*|.*logout.*

# Alert filters: re-grade known false positives. Format (semicolon-separated):
#   ruleId|newLevel|urlRegex
# newLevel: -1 = False Positive (hidden), 0 = Informational, 1 = Low, 2 = Medium, 3 = High
#
# 10062 = "PII Disclosure" - Shopify GIDs are Luhn-valid digit strings that land in
# card-number ranges, so this rule flags them as leaked cards. Verified on production
# 2026-07-17 (all 18 High alerts were gid://shopify/... IDs). Demoted to Informational
# so it stays visible without failing the run. Full reasoning in production.properties
# and docs/security-zap.md.
zap.alert.filters=10062|0|
# Browser the AJAX spider drives. MUST be headless (the ZAP container has no X server)
# and MUST exist in the image: zaproxy/zap-stable ships Firefox ESR but NOT Chrome, so
# "chrome-headless" fails with an opaque {"code":"internal_error"}.
zap.ajax.spider.browser=firefox-headless

# Which OWASP Top 10 edition the report is written against: 2021 or 2025.
# Defaults to 2025 (the current list). ZAP 2.17 tags every alert with BOTH editions, and
# measured tag coverage is identical (237/239 = 99.2% on a real staging scan), so the
# choice costs no classification accuracy. 2021 is kept because audit and compliance
# paperwork still cites it. See docs/security-zap.md.
zap.owasp.edition=2025

# How the suite answers the cookie consent bar: reject (default) | accept | ignore.
# "reject" keeps the run closest to a clean room - no analytics_storage, no ad_storage,
# no marketing tags firing during a test, and no synthetic traffic fed into the site's
# analytics. The bar is a real modal (role=dialog, z-index 9999) pinned to the bottom of
# the viewport, so leaving it up ("ignore") WILL intercept clicks near the bottom of the
# page. Handled globally in BasePage.open() via SiteOverlayHandler.
cookie.consent.mode=reject
