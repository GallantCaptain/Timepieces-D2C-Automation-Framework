# Healenium self-healing WebDriver configuration.
#
# This file is read DIRECTLY by com.epam.healenium.SelfHealingDriver from the test
# classpath root — it is NOT resolved through ConfigReader, so it cannot use the
# framework's usual -D / env-var / properties precedence ladder, and it is the same
# file for every environment (staging/production). It only takes effect at all when
# DriverFactory.wrapWithHealenium(...) actually wraps the driver, which only happens
# when the `healenium.enabled` key (read via ConfigReader, see staging.properties /
# production.properties) is true.
#
# Keep `hlm.server.url` below in sync with the `healenium.server.url` key in the
# environment .properties files — that key is documentation/reference only for
# humans, since ConfigReader has no way to inject its value into this file.

# Address of the hlm-backend REST service that stores learned locators and serves
# healed replacements. Matches the healenium-postgres/hlm-backend services added to
# docker-compose.yml (hlm-backend publishes port 7878).
hlm.server.url=http://localhost:7878

# How many candidate healed locators to try, in ranked order, before giving up and
# letting the original NoSuchElementException propagate.
recovery-tries=5

# Minimum similarity score (0.0-1.0) a candidate locator must reach to be accepted
# as a healed replacement. Lower = more aggressive healing, higher risk of healing
# to the wrong element.
score-cap=0.6

# Healenium's optional "imitate hover" support (used by the selector-imitator
# service) is not wired up in docker-compose.yml, so this stays disabled.
imitate-hover=false

# Node attributes compared when scoring candidate elements during healing.
select-node-attribute=id,name,type,value,text
